<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HowMuchFor - Categories</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="items.html">📦 Items</a>
    <a class="active" href="categories.html">🗂️ Categories</a>
    <a href="insights.html">💡 Insights</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <div class="content">
    <header>
      <h1>Categories</h1>
      <p>Manage the categories you track items under.</p>
    </header>

    <form id="category-form">
      <input type="text" id="category-name" placeholder="Category name" required>

      <select id="category-icon" required>
        <option value="" disabled selected>Choose an icon</option>
        <option value="🔌">🔌</option>
        <option value="🛋️">🛋️</option>
        <option value="🚴">🚴</option>
        <option value="⌚">⌚</option>
        <option value="🖼️">🖼️</option>
        <option value="🌱">🌱</option>
        <option value="🍽️">🍽️</option>
        <option value="👕">👕</option>
        <option value="📚">📚</option>
        <option value="🧰">🧰</option>
        <option value="🎸">🎸</option>
        <option value="🎮">🎮</option>
        <option value="📷">📷</option>
        <option value="💍">💍</option>
        <option value="🧸">🧸</option>
        <option value="🚗">🚗</option>
        <option value="🖥️">🖥️</option>
        <option value="🧴">🧴</option>
        <option value="🎨">🎨</option>
        <option value="📦">📦</option>
      </select>

      <button type="submit">Add Category</button>
    </form>

    <h2>Add a Subcategory</h2>
      <form id="subcategory-form">
        <input type="text" id="subcategory-name" placeholder="Subcategory name" required>

        <select id="parent-category" required>
          <option value="" disabled selected>Select parent category</option>
        </select>

        <button type="submit">Add Subcategory</button>
      </form>

    <h2>Your Categories</h2>
      <div id="categories-list"></div>

    <p id="category-status"></p>

    <h2>Your Subcategories</h2>
      <div id="subcategories-list"></div>

    <p id="subcategory-status"></p>

  </div>

  <script src="js/categories.js"></script>
</body>
</html>
