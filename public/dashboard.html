<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HowMuchFor - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <a class="active" href="dashboard.html">📊 Dashboard</a>
    <a href="items.html">📦 Items</a>
    <a href="categories.html">🗂️ Categories</a>
    <a href="insights.html">💡 Insights</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <div class="content">
    <header>
      <h1 id="dashboard-title">Dashboard</h1>
        <p>An overview of everything you own.</p>
    </header>

    <div id="total-value-card">
      <p>Total estimated resale value</p>
      <h2 id="total-value">Loading...</h2>
    </div>

    <h2>By Category</h2>
    <div id="category-summary-list"></div>

    <h2>All Items</h2>
    <table id="dashboard-items-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Subcategory</th>
          <th>Purchase Date</th>
          <th>Purchase Price</th>
          <th>Estimated Value</th>
        </tr>
      </thead>
      <tbody id="dashboard-items-list"></tbody>
    </table>

  </div>

<script src="js/dashboard.js"></script>
</body>
</html>
