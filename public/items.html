<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HowMuchFor - Items</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <a href="home.html">🏠 Home</a>
    <a href="dashboard.html">📊 Dashboard</a>
    <a class="active" href="items.html">📦 Items</a>
    <a href="categories.html">🗂️ Categories</a>
    <a href="insights.html">💡 Insights</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <div class="content">
    <header>
      <h1>Items</h1>
      <p>Add a new item to your inventory.</p>
    </header>

    <form id="item-form">
      <input type="text" id="name" placeholder="Item name" required>

      <select id="category" required>
        <option value="" disabled selected>Select category</option>
      </select>

      <select id="subcategory" disabled required>
        <option value="" disabled selected>Select category first</option>
      </select>

      <input type="date" id="purchase_date">
      <input type="number" id="purchase_price" placeholder="Purchase price" step="0.01">
      <input type="number" id="estimated_value" placeholder="Estimated resale value" step="0.01">
      <button type="submit">Add Item</button>
    </form>

    <p id="form-status"></p>

    <h2>Your Items</h2>

    <label for="category-filter">Filter by category:</label>
    <select id="category-filter">
      <option value="All">All</option>
      <option value="Electronics">Electronics</option>
      <option value="Furniture">Furniture</option>
      <option value="Sports">Sports</option>
      <option value="Accessories">Accessories</option>
      <option value="Decoration">Decoration</option>
      <option value="Plants">Plants</option>
      <option value="Tableware">Tableware</option>
      <option value="Other">Other</option>
    </select>

    <table id="items-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Subcategory</th>
          <th>Purchase Date</th>
          <th>Purchase Price</th>
          <th>Estimated Value</th>
          <th> </th>
        </tr>
      </thead>
      <tbody id="items-list">
      </tbody>
    </table>
  </div>

  <script src="js/items.js"></script>
</body>
</html>
