<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HowMuchFor - Items</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <a href="home.html">🏠 Home</a>
    <a href="dashboard.html">📊 Dashboard</a>
    <a class="active" href="items.html">📦 Items</a>
    <a href="categories.html">🗂️ Categories</a>
    <a href="insights.html">💡 Insights</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <div class="content">
    <header>
      <h1>Items</h1>
      <p>Add a new item to your inventory.</p>
    </header>

    <form id="item-form">
      <input type="text" id="name" placeholder="Item name" required>
      <input type="text" id="category" placeholder="Category">
      <input type="text" id="subcategory" placeholder="Subcategory">
      <input type="date" id="purchase_date">
      <input type="number" id="purchase_price" placeholder="Purchase price" step="0.01">
      <input type="number" id="estimated_value" placeholder="Estimated resale value" step="0.01">
      <button type="submit">Add Item</button>
    </form>

    <p id="form-status"></p>

    <h2>Your Items</h2>
    <table id="items-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Subcategory</th>
          <th>Purchase Date</th>
          <th>Purchase Price</th>
          <th>Estimated Value</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="items-list">
      </tbody>
    </table>
  </div>

  <script src="js/items.js"></script>
</body>
</html>
